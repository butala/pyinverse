[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pyinverse"
description = "A lightweight inverse-problems and tomography testbed"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mark D. Butala" }]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
]
# The numerical core needs only these two.  Everything else is optional and
# imported lazily; see the extras below and pyinverse/_optional.py.
dependencies = [
    "numpy>=1.21",
    "scipy>=1.7",
]
dynamic = ["version"]

[project.optional-dependencies]
# Plotting (RegularGrid.plot / imshow).
view = ["matplotlib>=3.5"]
# Reading images from disk (RegularGrid.from_image).
image = ["imageio>=2.9"]
# 3-D rendering: VTK plus pyviz4d (colour transfer function, isosurfaces and
# the Viewer4D used by the `__main__` blocks and the notebooks) and Matplotlib
# for the colormap registries those helpers sample.  pyviz4d is not on PyPI, so
# pull it from the project repository at a pinned revision.
viz = [
    "vtk>=9.0",
    "matplotlib>=3.6",
    "pyviz4d @ git+https://github.com/butala/pyviz4d.git@fd12742692710412e9fa8b53dae041f5da417aee",
]
# Progress bars.  Absent tqdm, everything degrades to plain iteration.
progress = ["tqdm>=4.60"]
# The test suite and the dev tooling.
test = ["pytest>=7"]
dev = ["pytest>=7", "ruff>=0.5"]

[project.urls]
Homepage = "https://github.com/butala/pyinverse"

[project.scripts]
pyinverse-radon = "pyinverse.radon:main"
pyinverse-ray3 = "pyinverse.ray3:main"

[tool.setuptools]
# The C sources live inside the package directory for the optional extension;
# they belong in the sdist (see MANIFEST.in) but not in the wheel.
include-package-data = false

[tool.setuptools.dynamic]
version = { attr = "pyinverse._version.__version__" }

[tool.setuptools.packages.find]
include = ["pyinverse*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
markers = ["slow: tests that take more than a few seconds"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.format]
# ``ruff format`` is not enforced: it would rewrite the whole library to a
# different whitespace/quote style, which is not worth the diff noise.
quote-style = "single"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "NPY"]

[tool.ruff.lint.per-file-ignores]
# ``np.trapz`` is used deliberately as the NumPy < 2 fallback for ``trapezoid``.
"tests/fbp_validation.py" = ["NPY201"]
